<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title data-i18n="newtab_title"></title>
  <link rel="stylesheet" href="vendor/gridstack/gridstack.min.css">
  <link rel="stylesheet" href="css/newtab.css">
  <script src="vendor/gridstack/gridstack-all.js"></script>  <script src="js/app.js" type="module"></script>
</head>
<body>
  <div id="toolbar" class="toolbar">
    <div class="edit-tools">
      <button id="add-widget" class="tb-btn" type="button"><span data-i18n="toolbar_add_widget"></span></button>
      <button id="layout-menu-button" class="tb-btn" type="button" aria-haspopup="menu" data-i18n-title="toolbar_layouts_title"><span data-i18n="toolbar_layouts"></span><span id="layout-current" class="tb-sub"></span></button>
      <div id="layout-menu" class="tb-menu" role="menu" popover="auto"></div>
      <button id="open-prefs" class="tb-btn" type="button"><span data-i18n="toolbar_prefs"></span></button>
      <button id="export" class="tb-btn" type="button" data-i18n-title="toolbar_export_title"><span data-i18n="toolbar_export"></span></button>
      <button id="import" class="tb-btn" type="button" data-i18n-title="toolbar_import_title"><span data-i18n="toolbar_import"></span></button>
    </div>
    <button id="update-notice" class="tb-btn tb-update" type="button" data-i18n-title="update_available_title" hidden></button>
    <button id="toggle-edit" class="tb-btn tb-toggle" type="button"></button>
  </div>

  <main class="page">
    <div id="grid" class="grid-stack"></div>
    <p id="empty" class="empty" data-i18n="newtab_empty" hidden></p>
  </main>
</body>
</html>
